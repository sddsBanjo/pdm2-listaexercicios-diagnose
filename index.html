<!DOCTYPE html>

    <title>Atividade de diagnose - PDM2</title>
    <link rel="manifest" href="manifest.json">

<body>
    <!-- Exercício 1 -->

    <button id="but_ex10_sub" onClick="ex10('subtracao')">Subtrair</button>
    <button id="but_ex10_mult" onClick="ex10('multiplicacao')">Multiplicar</button>
    <button id="but_ex10_div" onClick="ex10('divisao')">Dividir</button>

    <script src="app.js"></script>
